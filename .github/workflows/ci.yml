name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # 作息/日记测试将本地日历与 +08:00 的消息时间对照；与线上一致，不依赖 runner 的 UTC 默认值。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # 依赖审计门（ADR 0070 第 11 项）：high / critical 或基线之外的新公告不通过；历史基线见 docs/security/npm-audit-baseline.json
      - run: node packages/bot/src/ops/audit-gate-cli.ts
