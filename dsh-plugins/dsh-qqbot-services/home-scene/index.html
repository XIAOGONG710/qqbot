<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>林梦瑶 · 她的家</title>
  <link rel="stylesheet" href="scene.css">
</head>
<body>
  <main id="scene" aria-label="林梦瑶的家"></main>
  <header><h1>她的家</h1><p id="status" role="status">她现在没有公开状态。</p></header>
  <nav aria-label="视角">
    <button type="button" id="rotate" aria-label="旋转视角">旋转</button>
    <button type="button" id="zoom-in" aria-label="放大">＋</button>
    <button type="button" id="zoom-out" aria-label="缩小">－</button>
    <button type="button" id="reset">全景</button>
  </nav>
  <p id="fallback" hidden>此设备无法显示 3D 场景，仍可查看上方的公开状态。</p>
  <script type="module" src="scene.js"></script>
</body>
</html>
