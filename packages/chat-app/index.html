<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4eee6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>聊天</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app">

    <section id="pair" class="pair" hidden aria-labelledby="pairTitle">
      <div class="pair-card">
        <div class="pair-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48"><path d="M24 40c-1 0-14-8.2-14-18.4C10 16 14 12 18.6 12c2.3 0 4.2 1 5.4 2.8C25.200 13 27.100 12 29.400 12 34 12 38 16 38 21.600 38 31.800 25 40 24 40z" fill="currentColor"/></svg>
        </div>
        <h1 id="pairTitle">配对这台设备</h1>
        <p class="pair-lead">在家里的电脑上生成一个配对码，填在下面。只需要配对一次，之后打开就能聊。</p>
        <form id="pairForm" novalidate>
          <label class="field">
            <span class="field-label">8 位配对码</span>
            <input id="pairCode" class="code-input" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="next" maxlength="12" placeholder="0000 0000" aria-describedby="pairError" required>
          </label>
          <label class="field">
            <span class="field-label">这台设备叫什么</span>
            <input id="pairName" class="text-input" autocomplete="off" enterkeyhint="go" maxlength="40" required>
          </label>
          <p id="pairError" class="pair-error" role="alert" hidden></p>
          <button id="pairSubmit" class="primary" type="submit">配对</button>
        </form>
        <details class="pair-help">
          <summary>配对码在哪里拿</summary>
          <p>在跑中继的电脑上打开终端，运行：</p>
          <pre><code>npm run pair --workspace @qqbot/chat-bridge</code></pre>
          <p>屏幕上会出现 8 位数字，10 分钟内有效，只能用一次；连续输错 5 次会作废，重新生成即可。</p>
        </details>
      </div>
    </section>

    <section id="chat" class="chat" hidden aria-label="对话">
      <header class="bar">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div class="who">
          <h1 id="peerName" class="peer-name"></h1>
          <p id="peerStatus" class="peer-status" role="status" aria-live="polite"></p>
        </div>
        <button id="upstreamChip" class="chip" type="button" hidden><span class="chip-dot" aria-hidden="true"></span><span>QQ</span></button>
        <button id="openSettings" class="icon-btn" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="1.800" fill="currentColor"/><circle cx="12" cy="12" r="1.800" fill="currentColor"/><circle cx="19" cy="12" r="1.800" fill="currentColor"/></svg>
        </button>
      </header>

      <main id="scroller" class="scroller" tabindex="-1">
        <p id="topNote" class="top-note" aria-live="polite"></p>
        <ol id="list" class="list" role="log" aria-label="聊天记录" aria-live="off"></ol>
        <div id="typing" class="typing" hidden>
          <span class="typing-bubble" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="sr-only">对方正在输入</span>
        </div>
        <div id="bottomAnchor" class="bottom-anchor"></div>
      </main>

      <button id="toBottom" class="to-bottom" type="button" hidden aria-label="回到最新消息">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9.500l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="toBottomCount" class="to-bottom-count" hidden></span>
      </button>

      <footer id="composer" class="composer">
        <div id="replyBar" class="reply-bar" hidden>
          <div class="reply-bar-text"><span id="replyWho" class="reply-who"></span><span id="replyText" class="reply-text"></span></div>
          <button id="replyCancel" class="icon-btn small" type="button" aria-label="取消引用">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="tray" class="tray" hidden aria-label="待发送的图片"></div>
        <div id="plusMenu" class="plus-menu" hidden>
          <button id="pickGalleryBtn" type="button" class="plus-item">
            <span class="plus-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="3.500" y="4.500" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.700"/><circle cx="9" cy="10" r="1.600" fill="currentColor"/><path d="M4.500 17l4.500-4.500 3.500 3.500 2.500-2.500 4.500 4.500" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linejoin="round"/></svg></span>
            <span>相册</span>
          </button>
          <button id="pickCameraBtn" type="button" class="plus-item">
            <span class="plus-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 8.500A2.500 2.500 0 016.500 6h1.300l1.200-1.800h6L16.200 6h1.300A2.500 2.500 0 0120 8.500v8A2.500 2.500 0 0117.500 19h-11A2.500 2.500 0 014 16.500z" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linejoin="round"/><circle cx="12" cy="12.500" r="3.200" fill="none" stroke="currentColor" stroke-width="1.700"/></svg></span>
            <span>拍照</span>
          </button>
          <button id="pokeBtn" type="button" class="plus-item">
            <span class="plus-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9.500 11V5.500a1.500 1.500 0 013 0V11m0-1.500a1.500 1.500 0 013 0V12m0-1a1.500 1.500 0 013 0v4.500c0 3-2.200 5-5.200 5h-1.100c-1.800 0-3-.7-4.100-2.100L5.300 15a1.500 1.500 0 012.400-1.800l1.800 2" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span>戳一戳</span>
          </button>
        </div>
        <div id="inputRow" class="input-row">
          <button id="plusBtn" class="icon-btn" type="button" aria-label="更多：图片、拍照、戳一戳" aria-expanded="false" aria-controls="plusMenu">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.700"/><path d="M12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/></svg>
          </button>
          <textarea id="input" class="input" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="输入消息" enterkeyhint="enter" autocomplete="off"></textarea>
          <button id="micBtn" class="icon-btn" type="button" aria-label="语音：点一下开始录，或按住说话">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="9" y="3.500" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.700"/><path d="M5.500 11.500a6.500 6.500 0 0013 0M12 18v2.500" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/></svg>
          </button>
          <button id="sendBtn" class="send-btn" type="button" aria-label="发送" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V6m0 0l-5.500 5.500M12 6l5.500 5.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="recordBar" class="record-bar" hidden>
          <button id="recordCancel" class="text-btn" type="button">取消</button>
          <div class="record-meter" role="status" aria-live="off"><span class="record-dot" aria-hidden="true"></span><span id="recordTime" class="record-time">0:00</span><span id="recordHint" class="record-hint">正在录音</span></div>
          <button id="recordSend" class="send-btn" type="button" aria-label="发送语音">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V6m0 0l-5.500 5.500M12 6l5.500 5.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </footer>
    </section>

    <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="查看图片">
      <img id="viewerImg" class="viewer-img" alt="">
      <div class="viewer-bar">
        <button id="viewerSave" class="viewer-btn" type="button">保存</button>
        <button id="viewerClose" class="viewer-btn" type="button">关闭</button>
      </div>
    </div>

    <div id="sheetWrap" class="sheet-wrap" hidden>
      <div id="sheetBackdrop" class="sheet-backdrop"></div>
      <div id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <input id="pickGallery" type="file" accept="image/*" multiple hidden>
    <input id="pickCamera" type="file" accept="image/*" capture="environment" hidden>
  </div>
  <noscript><p class="noscript">这个页面需要开启 JavaScript。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
