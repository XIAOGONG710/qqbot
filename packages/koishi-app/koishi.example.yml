# Koishi 实例配置模板（ADR 0008）：复制到 runtime/koishi/koishi.yml（不入库）再改。说明见 docs/koishi.md。
# 密钥只写 ${{ env.X }}，值放在用户级环境变量里。控制台保存时不做插值：adapter-onebot、auth 这两个插件的配置不要在控制台改，
# 要改就改这个文件（或改完重启 Koishi）。Koishi 第一次读这个文件时会改写它（插件名后面加随机后缀、去掉注释）。
plugins:
  server:
    host: 127.0.0.1
    port: 5140
  http: {}
  proxy-agent: {}
  database-sqlite:
    path: data/koishi.db
  console:
    open: false
  config: {}
  logger: {}
  auth:
    admin:
      username: admin
      password: ${{ env.QQBOT_KOISHI_PASSWORD }}
  adapter-onebot:
    protocol: ws
    # NapCat 网络配置里「WebSocket 服务端」的地址
    endpoint: ws://127.0.0.1:3001
    # 小号的 QQ 号
    selfId: '10000'
    token: ${{ env.QQBOT_ONEBOT_TOKEN }}
  qqbot:
    contacts:
      - qq: 10001
        name: 他的称呼
        tier: boyfriend
    unlistedFriends: false
    llm:
      baseUrl: https://api.deepseek.com
      model: deepseek-flash
      temperature: 1.3
      promptPostProcessing: semi
      # 思考：off / low / high / max（关 / 低 / 高 / 最高），不写 = 接口默认
      thinking: 'off'
    prompt:
      maxContext: 8192
      pinExamples: true
    memory:
      enabled: true
