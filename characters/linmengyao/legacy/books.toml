#
# 三本书 = 用户裁决（主 / 副 / 旧），**每一条事实都必须带 sources**。
# 没有来源的东西一个字都不许写进这个文件：查不到就写「未获取」，绝不编。
# 调研底稿：evidence/她的书单候选-2026-10-03.md
# 原始数据：evidence/书单候选-原始数据-2026-10-03/（逐本公开资料核验-2026-10-03.json）
# 本文件由 life_engine/books.py 读取，**不接进 reply/channel/persona**（本轮只做独立模块）。
#
# ── 字段口径 ────────────────────────────────────────────────
# id          模块内的稳定键（英文，给 kv 用；别改，改了进度就丢）
# role        main=主推 / side=副推 / old=旧爱（旧爱是设定里原本就有的那本）
# mode        "chat_plot"=允许聊具体情节（节点级） / "feeling_only"=只许聊感受
# chapters    公开资料上的**总章数**（必须与 sources 对得上）
# words       公开资料上的总字数（未获取就省略这一行）
# total_source 总章数/字数出自哪条来源（逐字指到上面某条 source）
# progress    她的进度：start_day=起始日（默认 2026-10-03）/ start_chapter / finished_is_fact
#   注意：**start_chapter 是设定，不是事实**；chapters 才是事实。进度会按天推进（见 books.py）。
#
# ── 情节节点口径（nodes）────────────────────────────────────
# from     第几章起读者才知道这件事。她当前章数 < from → 她**没读到那儿**，
#          只会说「我还没看到那呢」（这是本机制的核心：一句话解决所有穿帮）。
# keywords 命中这些词才算「他在问这件事」
# points   节点下**允许她说**的内容（每条都必须能在 sources 里查到）
# 规则：nodes 里不许出现任何来源覆盖不到的具体情节——宁缺毋滥。

