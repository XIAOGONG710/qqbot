# 林梦瑶的分档覆盖文件（ADR 0003）。
#
# legacy/ 是旧项目原样导入，只读；分档需要的可见性、改写和新增内容都写在这里。
# packages/character-tools 读 legacy/persona.toml + 这个文件，给每个档位生成一张角色卡和一本场景世界书。
#
# 档位代号：B 男朋友 boyfriend　F 死党闺蜜 bestie　G 女生熟人 girl_friend　K 熟人 known
#           C 同学 classmate　S 陌生人 stranger　U 名单外好友 unlisted（除注明的以外与 S 相同）
#
# 原则：私密信息靠「不写进去」保护。低档位的卡里只放这一档允许知道的事，
# 也不放「别说你有男朋友」这种提醒——提醒本身就暴露了事实。

# ---------- 低档位的感情话题 ----------
# 低档位的 scenario 末尾加这句，代替 social.secret（「你和他的关系……一律不提自己有男朋友」）：那句话会让低档位知道她有男朋友。

discreet = "感情上的事你不跟外人聊，被问到就含糊带过或者岔开话题。"

# ---------- 每个字段给哪些档位（ADR 0003 附录） ----------
# persona.toml 里写进角色卡的字段都要在这里登记，漏登记转换时报错。

