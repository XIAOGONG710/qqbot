# 林梦瑶的世界（ADR 0021）：会自己变的东西和推进规则。packages/character-tools 会改写这个文件，注释不会保留：说明写在 note 里。
start_day: "2026-08-31"
away_holidays: []
weather:
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
    - classmate
    - stranger
    - unlisted
  rain_chance: 0.15
  temps:
    "1": [-5, 4]
    "2": [-2, 8]
    "3": [3, 15]
    "4": [10, 22]
    "5": [16, 28]
    "6": [21, 32]
    "7": [24, 32]
    "8": [23, 31]
    "9": [18, 27]
    "10": [11, 21]
    "11": [3, 13]
    "12": [-3, 6]
  note: 先按日期生成（济南各月大概的最低、最高气温，一成半的日子下雨，同一天对所有人一样）；不写城市名（同学档以下不知道在济南）。以后接真实天气（ADR 0021 的 W5）
cat:
  name: 土豆
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
    - classmate
    - stranger
    - unlisted
  feed:
    - "18:30"
    - "21:30"
  seen_chance: 0.85
  food:
    bag_days: 20
    left: 8
    reorder_at: 3
  note: 来自 persona.yml daily_extra.cat（宿舍楼下的三花流浪猫，她起的名字，每天下楼喂）。晚上空的时候下楼；下雨、不在学校、猫粮没了不喂，晚上有课就下课后去。一袋猫粮够喂 20 天，剩 3 天的量就网上下单（走快递）
parcels:
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
    - classmate
    - stranger
    - unlisted
  per_week: 1.2
  arrive_days: [2, 3]
  keep_days: 3
  items:
    - 零食
    - 洗面奶
    - 数据线
    - 发圈
    - 秋天的外套
    - 笔记本
    - 猫条
    - 宿舍用的小台灯
  note: persona.yml 的例句「我快递到楼下了，帮我拿一下」。下单后几天到驿站，驿站留几天；她有空（09:00–21:00 没课）的时候去取，有时拖一天，最晚过期那天取
camera_fund:
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
  goal: 4500
  saved: 1800
  weekly: 100
  deposit_day: 7
  note: persona.yml money.saving「在攒钱买相机」。数字是可改的设定（ADR 0021，用户 10-06 授权按推荐定）：目标按二手入门微单加套机镜头；生活费两千多（family.money），每周日存 100；开学那天攒了 1800。攒够了先停在目标上（买不买、什么时候买以后再定）
homework:
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
    - classmate
    - stranger
    - unlisted
  kinds:
    - hard
    - machine
  chance: 0.5
  early_chance: 0.2
  note: 理论课和机房课每节一半的概率留作业，下一次这门课之前交；八成拖到交的前一晚才写（自传 v1「作业拖到最后一晚才开始」）。课名跟着作息的 course_detail，看不到课名的档位只说「作业」
family_call:
  tiers:
    - boyfriend
    - bestie
    - girl_friend
    - known
  weekday: 7
  time: "20:30"
  note: persona.yml family.bond「和家里挺亲，每周视频」；在学校的时候每周日晚上
