      - bestie
      - girl_friend
      - known
    named_tiers:
      - boyfriend
      - bestie
      - girl_friend
      - known
    note: 自传 v1 附三；作者裁决（docs/research/2026-10-06-dsh/author-replies.md 一·1、1b）：死党是她，只是 NPC，不做真的 QQ 联系人
  - id: su_yutong
    name: 苏雨桐
    label: 同专业的朋友
