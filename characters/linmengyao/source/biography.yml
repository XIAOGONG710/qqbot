# 林梦瑶的过去（ADR 0022），素材出自 characters/linmengyao/biography/autobiography-v1.md（作者定稿）。packages/character-tools 会改写这个文件，注释不会保留：说明写在 note 里。
note: |-
  素材出自 characters/linmengyao/biography/autobiography-v1.md（作者 10-06 定稿，访谈记录 interview.md）。正文不在这里改：要改先改自传，再同步这份。
  这里是切好的块：年表是事实源；每块是一件事，第一人称的素材（不是台词），按档位可见。keys 是他这次的话里出现哪些词时想起这一块，不进提示词。
  具体的小区和楼号按作者 10-07 裁决只写在男朋友、闺蜜档可见的条目里（其余各档禁用词兜底，隐私检查会拦）；他的真名不写；「他」就是她的男朋友。gap：refuse 不想讲、vague 记不清、unsaid 心里的事不说出口。
timeline:
