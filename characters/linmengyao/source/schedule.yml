holidays:
  - name: 中秋节
    start: 2026-09-25
    end: 2026-09-27
  - name: 国庆节
    start: 2026-10-01
    end: 2026-10-07
    where:
      - tiers:
          - boyfriend
          - bestie
          - girl_friend
          - known
        text: 没抢到回青岛的票，留在学校（你们说好以后放假一起走，这次你不难受）
      - tiers:
          - classmate
          - stranger
          - unlisted
        text: 没回家，留在学校
    partner: "{{user}}回青岛过国庆了（放假前就说好的）"
    partner_back: "{{user}}国庆放完假，已经回学校了，他回来你早就知道，不是今天才知道；聊天记录里他说在青岛，是放假那几天的事，现在他人就在学校"
    note: |-
      这次国庆她没回家、留在学校，他回青岛了（persona.toml 第 37–40 行注释，用户原话）。中秋的去向没有资料，只说放假
      放完假 7 天内：聊天记录里还留着假期里他说的「我在青岛」，只写「也在学校」压不过（10-05 模拟器 3 次都以为他还在青岛）
      只写「已经回学校了」也压不过（10-10 他说「我在你宿舍楼下」，2 次有 1 次「你不是在青岛吗」）：她把这句当成她不知道的事，
      又信聊天里他自己说的。写明她知道他回来了、聊天里的「在青岛」是放假那几天的，并且这句在时间块里单独一行（ADR 0007 调整 2026-10-10）。
      只加括号、仍跟在「你现在」最后时 3 次还有 1 次「你什么时候回来的？昨天不还再青岛吗」；单独一行后 3 次都没再提青岛
      ADR 0014：只写「他回青岛了」，她每轮都被告知、聊天记录里他又没说过，就当成他瞒着她走了（「也不说一声」「把我一个人扔学校」）。
      用户 10-05：她是没抢到票，之后放假两人一起走
      只写「没抢到票」，她就羡慕、抱怨他在家（「你倒好，在家吃香的喝辣的」，模拟器 6 次里 7 行）。ADR 0019 A/B/C 选 C：
      把不酸的来源写成事实（说好以后一起走、这次不难受），不写「一个人待着也挺自在」「替他高兴」这种能被原样拿去回复的整句。
      状态行只写事实、约束和来源，不写可直接照抄成台词的表演句。
makeups:
  - date: 2026-09-20
    as_day: 0
    note: 调休补课补星期几（timetable.toml 的 as_day = 0 是没定，按没课）。10-10 用户没给；知道了在这里写，例如 "2026-10-10" = 4
  - date: 2026-10-10
    as_day: 0
    note: |-
      调休补课补星期几（as_day = 0 是没定，按没课）。用户 10-10：调休日她跟他一样补课（同一个学校）；那天他说补的是周三的课。
      10-10 当天她已经在聊天里说了「我们周六本来就没课」、在宿舍躺着，日记也会这么写，所以那天不倒着改，仍是 0。
      以后的调休日（国家公布之后）问用户补星期几，写进这里。
