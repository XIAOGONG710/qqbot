# 林梦瑶的作息（ADR 0007、0010）。控制台「林梦瑶」页面和 packages/character-tools 都会改写这个文件，注释不会保留：说明写在 note 里。
sleep: "02:00"
wakeup:
  early: "07:40"
  lazy: "09:30"
  jitter:
    from: "2026-10-26"
    spread_minutes: 40
    weekend_minutes: 60
    note: ADR 0078：原来每天精确 07:40 / 09:30 起，主动早安因此天天在同一刻。从 from 那天起每天按日期哈希浮动 ±40 分钟（有早课的最多 10 分钟，不晚于第一节课前 25 分钟），周末没课再晚 1 小时。from 要比上线那天晚至少一天（上线那天已经写下的睡觉账不被改写）；晚上线就往后改
