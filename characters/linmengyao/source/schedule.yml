    label: 水课
  pe:
    label: 体育课
kinds_note: 课型（timetable.toml 开头的 tier 说明）：上课时过多少分钟才看到消息（see_after，分钟）、最多回几条
where:
  by_tier:
    - tiers:
        - boyfriend
        - bestie
        - girl_friend
        - known
      text: 在学校（济南），住宿舍
    - tiers:
        - classmate
        - stranger
        - unlisted
      text: 在学校，住宿舍
  note: 上学期间她在哪：学校在济南，两家都在青岛（persona.toml 第 37–43 行注释）。同学以下不给城市
partner:
  text: "{{user}}也在学校"
  tiers:
    - boyfriend
  note: |-
    上学期间他在哪：两人同校（relation.how「一路到大学都在一个学校」）。见面可以答应、见了面也在 QQ 上说话（ADR 0046），男朋友档的 demeanor 另有一句。
    写 {{user}} 不写「他」：运行时换成称呼。10-05 模拟器里写「他也在学校」，7 天前聊天记录里他说过在青岛，3 次有 2 次她仍以为他在青岛；
    写成「他也在学校，不在青岛」又有一次被她当成说自己（「我也在学校呢，没回青岛」）。放完国庆 7 天内用国庆的 partner_back（那里的 note 有后续）
